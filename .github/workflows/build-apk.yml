name: Build BPAY RC Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew wrapper --gradle-version 8.5
          ./gradlew assembleRelease --no-daemon

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore bpayrc-release.keystore -alias bpayrc -keyalg RSA -keysize 2048 -validity 10000 -storepass bpay123456 -keypass bpay123456 -dname "CN=Bpay Payments, OU=IT, O=Bpay, L=Hyderabad, S=AP, C=IN"

      - name: Sign Release APK
        run: |
          # If standard gradle release output exists, copy and rename it
          cp app/build/outputs/apk/release/app-release.apk bpayrc.apk || cp app/build/outputs/apk/debug/app-debug.apk bpayrc.apk

      - name: Upload bpayrc.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpayrc-apk
          path: bpayrc.apk
