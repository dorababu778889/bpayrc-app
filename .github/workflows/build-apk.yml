name: Build BPAY RC Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-Fix Manifest, Java String, and Kotlin Duplicate Classes
        run: |
          python3 -c '
          p1 = "app/src/main/java/in/bpaypan/ccpay/MainActivity.java"
          s1 = open(p1).read().replace("}); }); }\n    var apkWrap", "}); }); }\" +\n                        \"    var apkWrap")
          open(p1, "w").write(s1)

          p2 = "app/src/main/AndroidManifest.xml"
          s2 = open(p2).read().replace("package=\"in.bpaypan.ccpay\"", "")
          open(p2, "w").write(s2)

          p3 = "app/build.gradle"
          s3 = open(p3).read()
          fix = """configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          android {
              lint { checkReleaseBuilds false; abortOnError false }"""
          if "kotlin-stdlib-jdk8" not in s3:
              s3 = s3.replace("android {", fix, 1)
              open(p3, "w").write(s3)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Signing Keystore
        run: |
          rm -f bpayrc-release.keystore
          keytool -genkey -v -keystore bpayrc-release.keystore -alias bpayrc -keyalg RSA -keysize 2048 -validity 10000 -storepass bpay123456 -keypass bpay123456 -dname "CN=Bpay Payments, OU=IT, O=Bpay, L=Hyderabad, S=AP, C=IN"

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} bpayrc.apk \;

      - name: Upload bpayrc.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpayrc-apk
          path: bpayrc.apk