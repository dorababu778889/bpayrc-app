name: Build BPAY RC Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.5
            chmod +x ./gradlew
          fi

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore bpayrc-release.keystore -alias bpayrc -keyalg RSA -keysize 2048 -validity 10000 -storepass bpay123456 -keypass bpay123456 -dname "CN=Bpay Payments, OU=IT, O=Bpay, L=Hyderabad, S=AP, C=IN"

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Locate and Copy APK
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} bpayrc.apk \;

      - name: Upload bpayrc.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpayrc-apk
          path: bpayrc.apk
