plugins {
    id 'com.android.application'
}

android {
    namespace 'in.bpaypan.ccpay'
    compileSdk 34

    defaultConfig {
        applicationId "in.bpaypan.ccpay"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file("../bpayrc-release.keystore")
            storePassword "bpay123456"
            keyAlias "bpayrc"
            keyPassword "bpay123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
